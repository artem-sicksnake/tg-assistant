<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ассистент</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b0f; --glass: rgba(255,255,255,.055); --glass-hi: rgba(255,255,255,.10);
    --stroke: rgba(255,255,255,.10); --stroke-hi: rgba(255,255,255,.22);
    --text: #f4f2ed; --dim: #9a9890; --gold: #d9b878; --gold-soft: rgba(217,184,120,.16);
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.45 "Manrope", -apple-system, sans-serif;
    padding: 18px 14px 110px; overflow-x: hidden; position: relative;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(52% 38% at 82% -6%, rgba(217,184,120,.14), transparent 70%),
      radial-gradient(60% 44% at -12% 104%, rgba(96,118,168,.16), transparent 70%);
  }
  #app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; }
  .kicker { font: 600 10px/1 "Unbounded", sans-serif; letter-spacing: .32em;
    text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
  h1 { font: 800 24px/1.15 "Unbounded", sans-serif; margin-bottom: 14px; }

  .card {
    position: relative; border-radius: 20px;
    background: linear-gradient(160deg, var(--glass-hi), var(--glass) 45%);
    border: 1px solid var(--stroke);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    box-shadow: 0 18px 40px -22px rgba(0,0,0,.85); margin-bottom: 12px;
  }
  .card::before { content: ""; position: absolute; inset: 0 12% auto 12%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); }

  .digest { padding: 4px 15px; }
  .digest-head { display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; cursor: pointer; }
  .digest-head b { font: 600 12px/1 "Unbounded", sans-serif; letter-spacing: .1em;
    text-transform: uppercase; }
  .chev { color: var(--gold); transition: transform .25s; font-size: 13px; }
  .digest.open .chev { transform: rotate(180deg); }
  .digest-body { display: none; padding: 2px 0 14px; white-space: pre-wrap;
    font-size: 13.5px; line-height: 1.55; color: #d9d7d0; max-height: 46vh; overflow-y: auto; }
  .digest.open .digest-body { display: block; }
  .digest-body .sec { color: var(--gold); font-weight: 700; }

  .task { padding: 15px 15px 13px; opacity: 0; transform: translateY(14px);
    animation: rise .5s cubic-bezier(.22,.8,.3,1) forwards;
    transition: border-color .3s, background .3s, box-shadow .3s; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .task.sel {
    border-color: rgba(217,184,120,.55);
    background: linear-gradient(160deg, rgba(217,184,120,.14), rgba(217,184,120,.04) 55%),
                linear-gradient(160deg, var(--glass-hi), var(--glass) 45%);
    box-shadow: 0 0 0 1px rgba(217,184,120,.18), 0 18px 44px -20px rgba(217,184,120,.22),
                0 18px 40px -22px rgba(0,0,0,.85);
  }
  .task.sel .num { border-color: var(--gold); box-shadow: 0 0 12px rgba(217,184,120,.35); }
  .num { position: absolute; top: -9px; right: 14px; font: 600 10px/1 "Unbounded", sans-serif;
    letter-spacing: .12em; color: var(--gold); background: #14130f;
    border: 1px solid rgba(217,184,120,.45); border-radius: 99px; padding: 5px 9px; }
  .row1 { display: flex; gap: 12px; align-items: flex-start; }
  .chk { appearance: none; -webkit-appearance: none; flex: none; cursor: pointer;
    width: 24px; height: 24px; margin-top: 4px; border-radius: 8px;
    border: 1.5px solid var(--stroke-hi); background: rgba(255,255,255,.04);
    display: grid; place-items: center; transition: all .2s; }
  .chk:checked { background: var(--gold); border-color: var(--gold); }
  .chk:checked::after { content: ""; width: 6px; height: 11px; margin-top: -2px;
    border: solid #14130f; border-width: 0 2.5px 2.5px 0; transform: rotate(42deg); }
  textarea.title { flex: 1; background: transparent; border: none; outline: none; resize: none;
    color: var(--text); font: 600 15px/1.4 "Manrope", sans-serif; padding: 3px 0; }
  .clear { background: none; border: none; color: var(--dim); font-size: 17px; padding: 2px 4px; flex: none; }
  .meta { display: flex; gap: 8px; margin-top: 11px; flex-wrap: wrap; align-items: center; }
  select, input[type=date] { appearance: none; -webkit-appearance: none; outline: none;
    background: rgba(255,255,255,.05); color: var(--text); border: 1px solid var(--stroke);
    border-radius: 11px; padding: 7px 11px; font: 500 13px "Manrope", sans-serif; min-height: 34px; }
  select:focus, input[type=date]:focus, textarea.title:focus { border-color: rgba(217,184,120,.55); }
  input[type=date].empty { color: var(--dim); }

  .chipsel { background: rgba(255,255,255,.05); color: var(--text); cursor: pointer;
    border: 1px solid var(--stroke); border-radius: 11px; padding: 7px 11px;
    font: 500 13px "Manrope", sans-serif; min-height: 34px; max-width: 46vw;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chipsel:active { border-color: rgba(217,184,120,.55); }

  .sheet { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.6);
    display: flex; align-items: flex-end; animation: fadein .18s; }
  @keyframes fadein { from { opacity: 0 } }
  .sheet-in { width: 100%; max-height: 62vh; overflow-y: auto;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    background: #15161d; border-radius: 24px 24px 0 0; padding: 10px 14px 34px;
    animation: up .22s cubic-bezier(.22,.8,.3,1); }
  @keyframes up { from { transform: translateY(40px); opacity: .5 } }
  .sheet-title { font: 600 10px/1 "Unbounded", sans-serif; letter-spacing: .2em;
    text-transform: uppercase; color: var(--dim); padding: 10px 6px 12px; }
  .opt { padding: 14px 10px; border-radius: 12px; font: 500 15px "Manrope", sans-serif;
    display: flex; justify-content: space-between; align-items: center; }
  .opt:active { background: rgba(255,255,255,.06); }
  .opt.sel { color: var(--gold); }

  .stats { padding: 14px 15px 16px; }
  .stats h3 { font: 600 12px/1 "Unbounded", sans-serif; letter-spacing: .1em;
    text-transform: uppercase; margin-bottom: 14px; }
  .metrics { display: flex; gap: 10px; margin-bottom: 16px; }
  .metric { flex: 1; background: rgba(255,255,255,.04); border: 1px solid var(--stroke);
    border-radius: 14px; padding: 10px 12px; }
  .metric b { display: block; font: 800 22px/1.1 "Unbounded", sans-serif; color: var(--gold); }
  .metric span { font-size: 11.5px; color: var(--dim); }
  .brow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .bname { flex: 0 0 34%; font-size: 12px; color: #d9d7d0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .btrack { flex: 1; height: 10px; border-radius: 6px; background: rgba(255,255,255,.05); }
  .bfill { height: 100%; border-radius: 6px; width: 0;
    background: linear-gradient(90deg, rgba(217,184,120,.5), var(--gold));
    transition: width .7s cubic-bezier(.22,.8,.3,1); }
  .bval { flex: 0 0 26px; font-size: 11.5px; color: var(--dim); text-align: right; }
  .hours { display: flex; align-items: flex-end; gap: 2px; height: 52px; margin-top: 14px; }
  .hbar { flex: 1; border-radius: 3px 3px 0 0; background: rgba(217,184,120,.35); min-height: 2px; }
  .hlabels { display: flex; justify-content: space-between; font-size: 10px;
    color: var(--dim); margin-top: 5px; }

  .ghost { width: 100%; border-radius: 20px; padding: 15px; margin-top: 4px; cursor: pointer;
    background: transparent; color: var(--dim); border: 1.5px dashed rgba(255,255,255,.18);
    font: 600 14px "Manrope", sans-serif; transition: all .2s; }
  .ghost:active { border-color: var(--gold); color: var(--gold); background: var(--gold-soft); }
  .rerun { width: 100%; margin-top: 14px; padding: 15px; cursor: pointer;
    border-radius: 20px; border: 1px solid rgba(217,184,120,.4);
    background: linear-gradient(160deg, rgba(217,184,120,.20), rgba(217,184,120,.06));
    color: var(--gold); font: 600 13px "Unbounded", sans-serif; letter-spacing: .04em; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 10px; text-align: center; line-height: 1.5; }
  .err { color: #e07a6a; font-size: 13px; margin-top: 10px; text-align: center; }
</style>
</head>
<body>
<div id="app">
  <div class="kicker">Daily · Assistant</div>
  <h1 id="h1">Сводка</h1>
  <div class="hint" style="text-align:left; margin:-6px 0 14px;">Отметь галочкой, что отправить в ClickUp. Текст, исполнителя и срок можно править.</div>

  <div class="card digest" id="digestCard" style="display:none">
    <div class="digest-head" onclick="this.parentNode.classList.toggle('open')">
      <b>Сводка дня</b><span class="chev">▼</span>
    </div>
    <div class="digest-body" id="digestBody"></div>
  </div>

  <div id="list"></div>
  <button class="ghost" onclick="addManual()">＋ Своя таска</button>
  <button class="rerun" onclick="rerun()">⟳ Пересобрать сводку</button>
  <div class="hint">Пересборка анализирует только новое с прошлого раза, ~1–2 мин.<br>
  🎙 Голосовые правки: закрой редактор и просто надиктуй боту голосовое.</div>
  <div class="card stats" id="stats" style="display:none"></div>
  <div id="err" class="err"></div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
tg.setHeaderColor("#0a0b0f"); tg.setBackgroundColor("#0a0b0f");

let payload = { d: "", t: [], u: [], ls: [], dg: "" };
let USERS = ["Я"], LISTS = ["Default"], items = [];

function b64bytes(s) {
  return Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
}

async function loadPayload() {
  let frag = location.hash.slice(1);
  try { frag = decodeURIComponent(frag); } catch (e) {}
  const m = frag.match(/(?:^|[&?])z:([A-Za-z0-9_\-]+=*)/);
  if (m) {
    const stream = new Blob([b64bytes(m[1])]).stream()
      .pipeThrough(new DecompressionStream("deflate"));
    const buf = await new Response(stream).arrayBuffer();
    payload = JSON.parse(new TextDecoder("utf-8").decode(buf));
    return;
  }
  const legacy = frag.split("&")[0];
  if (!legacy || legacy.startsWith("tgWebApp")) return;
  payload = JSON.parse(new TextDecoder("utf-8").decode(b64bytes(legacy)));
}

function listTree() {
  const tree = {};
  LISTS.forEach(full => {
    const space = full.includes(" / ") ? full.split(" / ")[0] : "Другое";
    (tree[space] = tree[space] || []).push(full);
  });
  return tree;
}

function shortList(full) {
  return full.includes(" / ") ? full.split(" / ").slice(1).join(" / ") : full;
}

function makeSheet(title, rows, onPick) {
  const sheet = document.createElement("div");
  sheet.className = "sheet";
  sheet.innerHTML = `<div class="sheet-in">
    <div class="sheet-title">${title}</div>
    ${rows.map(r => `<div class="opt ${r.sel ? "sel" : ""}" data-v="${esc(r.v)}">
      ${esc(r.label)}${r.arrow ? ' <span style="color:var(--dim)">›</span>' : ""}${r.sel ? " ✓" : ""}</div>`).join("")}
  </div>`;
  sheet.onclick = (e) => {
    const opt = e.target.closest(".opt");
    if (opt) {
      sheet.remove();
      onPick(opt.dataset.v);
    } else if (e.target === sheet) {
      sheet.remove();
    }
  };
  document.body.appendChild(sheet);
}

function openPicker(i, field) {
  if (field === "w") {
    const cur = items[i].w;
    makeSheet("Исполнитель",
      USERS.map(o => ({ v: o, label: o, sel: o === cur })),
      v => { items[i].w = v; render(); tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); });
    return;
  }
  const tree = listTree();
  const cur = items[i].l;
  const curSpace = cur.includes(" / ") ? cur.split(" / ")[0] : null;
  const openLists = (space) => {
    const rows = [{ v: "__back__", label: "‹ Все спейсы" }]
      .concat(tree[space].map(f => ({ v: f, label: shortList(f), sel: f === cur })));
    makeSheet(space, rows, v => {
      if (v === "__back__") { openSpaces(); return; }
      items[i].l = v;
      render();
      tg.HapticFeedback && tg.HapticFeedback.selectionChanged();
    });
  };
  const openSpaces = () => {
    makeSheet("Спейс ClickUp",
      Object.keys(tree).map(s => ({ v: s, label: s, arrow: true, sel: s === curSpace })),
      openLists);
  };
  openSpaces();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
}

function renderDigest() {
  if (!payload.dg) return;
  const card = document.getElementById("digestCard");
  card.style.display = "block";
  document.getElementById("digestBody").innerHTML = esc(payload.dg)
    .split("\n")
    .map(l => /^(📌|⏳|📊|✅)/.test(l) ? `<span class="sec">${l}</span>` : l)
    .join("\n");
}

function render() {
  const box = document.getElementById("list");
  box.innerHTML = "";
  items.forEach((it, i) => {
    const div = document.createElement("div");
    div.className = "card task" + (it.on ? " sel" : "");
    div.style.animationDelay = (i * 50) + "ms";
    div.innerHTML = `
      <div class="num">${it.manual ? "NEW" : "№ " + it.n}</div>
      <div class="row1">
        <input type="checkbox" class="chk" ${it.on ? "checked" : ""}
               onchange="items[${i}].on=this.checked; softRender(${i}, this.checked)">
        <textarea class="title" rows="2"
          oninput="items[${i}].ti=this.value; updateButton()">${esc(it.ti)}</textarea>
        ${it.manual ? `<button class="clear" onclick="items.splice(${i},1);render()">✕</button>` : ""}
      </div>
      <div class="meta">
        <button class="chipsel" onclick="openPicker(${i},'w')">${esc(it.w)}</button>
        <input type="date" value="${it.du}" class="${it.du ? "" : "empty"}"
               onchange="items[${i}].du=this.value; this.classList.toggle('empty', !this.value)">
        <button class="chipsel" onclick="openPicker(${i},'l')">${esc(shortList(it.l))}</button>
      </div>`;
    box.appendChild(div);
  });
  updateButton();
}

function softRender(i, on) {
  document.querySelectorAll(".task")[i].classList.toggle("sel", on);
  updateButton();
}

function addManual() {
  items.push({ n: 0, ti: "", w: USERS[0], du: "", l: LISTS[0], on: true, manual: true });
  render();
  const areas = document.querySelectorAll("textarea.title");
  areas[areas.length - 1].focus();
}

function updateButton() {
  const cnt = items.filter(it => it.on && it.ti.trim()).length;
  if (cnt) {
    tg.MainButton.setParams({
      text: `Отправить в ClickUp (${cnt})`,
      color: "#d9b878", text_color: "#14130f", is_visible: true
    });
  } else {
    tg.MainButton.hide();
  }
}

tg.MainButton.onClick(() => {
  const out = {
    d: payload.d,
    t: items.filter(it => it.on && !it.manual && it.ti.trim())
            .map(it => ({ n: it.n, ti: it.ti.trim(), w: it.w, du: it.du, l: it.l })),
    m: items.filter(it => it.on && it.manual && it.ti.trim())
            .map(it => ({ ti: it.ti.trim(), w: it.w, du: it.du, l: it.l }))
  };
  const data = JSON.stringify(out);
  if (data.length > 4000) {
    document.getElementById("err").textContent = "Слишком много правок за раз, убери часть тасков.";
    return;
  }
  tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
  tg.sendData(data);
});

function rerun() {
  tg.HapticFeedback && tg.HapticFeedback.impactOccurred("medium");
  tg.sendData(JSON.stringify({ cmd: "run" }));
}

function renderStats() {
  const st = payload.st;
  if (!st || !st.tot) return;
  const box = document.getElementById("stats");
  box.style.display = "block";
  const maxTop = Math.max(...st.top.map(t => t[1]), 1);
  const maxHr = Math.max(...st.hrs, 1);
  const pct = Math.round(st.me / st.tot * 100);
  box.innerHTML = `
    <h3>📊 Статистика дня</h3>
    <div class="metrics">
      <div class="metric"><b>${st.tot}</b><span>сообщений</span></div>
      <div class="metric"><b>${st.me}</b><span>от тебя (${pct}%)</span></div>
      <div class="metric"><b>${st.top.length ? esc(st.top[0][0].split(" ")[0]) : "—"}</b><span>самый горячий чат</span></div>
    </div>
    ${st.top.map(t => `
      <div class="brow">
        <div class="bname">${esc(t[0])}</div>
        <div class="btrack"><div class="bfill" data-w="${Math.round(t[1] / maxTop * 100)}"></div></div>
        <div class="bval">${t[1]}</div>
      </div>`).join("")}
    <div class="hours">${st.hrs.map(h =>
      `<div class="hbar" style="height:${Math.max(4, Math.round(h / maxHr * 100))}%;
        ${h === maxHr ? "background:var(--gold);" : ""}"></div>`).join("")}</div>
    <div class="hlabels"><span>0</span><span>6</span><span>12</span><span>18</span><span>23</span></div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    box.querySelectorAll(".bfill").forEach(el => el.style.width = el.dataset.w + "%");
  }));
}

(async () => {
  try {
    await loadPayload();
  } catch (e) {
    document.getElementById("err").textContent = "Не смог прочитать данные: " + e.message;
  }
  USERS = payload.u && payload.u.length ? payload.u : ["Я"];
  LISTS = payload.ls && payload.ls.length ? payload.ls : ["Default"];
  if (payload.d) {
    document.getElementById("h1").textContent = "Сводка за " +
      new Date(payload.d + "T12:00:00").toLocaleDateString("ru", { day: "numeric", month: "long" });
  }
  items = (payload.t || []).map(t => ({
    n: t.n, ti: t.ti || "", w: t.w || USERS[0], du: t.du || "",
    l: t.l || LISTS[0], on: false, manual: false
  }));
  renderDigest();
  render();
  renderStats();
})();
</script>
</body>
</html>
